schema_version: "1.0"

extension:
  id: "azure-interview"
  name: "Spec Kit Azure Interview"
  version: "0.7.0"
  description: "Guided Azure architecture discovery before specification"
  author: "Robert Agterhuis"
  repository: "https://github.com/RobertAgterhuis/speckit-azure-interview"
  license: "MIT"
  homepage: "https://github.com/RobertAgterhuis/speckit-azure-interview"

requires:
  speckit_version: ">=0.1.0"

provides:
  commands:
    - name: "speckit.azure-interview.run"
      file: "commands/azure-interview.md"
      description: "Conduct a structured Azure architecture interview"
    - name: "speckit.azure-interview.inventory"
      file: "commands/azure-inventory.md"
      description: "Collect scoped read-only Azure inventory evidence"
    - name: "speckit.azure-interview.design"
      file: "commands/azure-design.md"
      description: "Generate a reviewable intended-state Azure architecture design"
    - name: "speckit.azure-interview.design-review"
      file: "commands/azure-design-review.md"
      description: "Record explicit human approval or rejection of an Azure design"
  templates:
    - name: "azure-context-markdown"
      file: "templates/azure-context-template.md"
      description: "Human-readable Azure interview output template"
    - name: "azure-context-schema"
      file: "templates/azure-context.schema.json"
      description: "JSON Schema for machine-readable interview output"
    - name: "azure-inventory-schema"
      file: "templates/azure-inventory.schema.json"
      description: "JSON Schema for unconfirmed Azure inventory evidence"
    - name: "azure-design-schema"
      file: "templates/azure-design.schema.json"
      description: "JSON Schema for reviewable intended-state Azure architecture"
    - name: "azure-design-review-schema"
      file: "templates/azure-design-review.schema.json"
      description: "JSON Schema for explicit intended-design review decisions"
  scripts:
    - name: "validate-azure-context"
      file: "scripts/python/validate_context.py"
      description: "Validate an Azure interview JSON context"
      runtimes:
        - "python"
    - name: "collect-azure-inventory"
      file: "scripts/python/collect_azure_inventory.py"
      description: "Collect scoped read-only Azure Resource Graph evidence"
      runtimes:
        - "python"
    - name: "generate-azure-design"
      file: "scripts/python/generate_azure_design.py"
      description: "Generate reviewable intended-state Azure design artifacts"
      runtimes:
        - "python"
    - name: "review-azure-design"
      file: "scripts/python/review_azure_design.py"
      description: "Record and publish an explicit intended-design review"
      runtimes:
        - "python"
    - name: "install-hermes-skill-adapter"
      file: "scripts/powershell/Install-HermesSkillAdapter.ps1"
      description: "Install the generated skill into a custom Hermes home"
      runtimes:
        - "powershell"
tags:
  - "azure"
  - "infrastructure"
  - "discovery"
  - "bicep"
  - "avm"
